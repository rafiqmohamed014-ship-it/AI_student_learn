<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reset your password — Kalvi AI</title>
<meta name="description" content="Send a password reset link to your Kalvi AI account." />
<meta name="theme-color" content="#080808" />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/css/layout.css" />
<link rel="stylesheet" href="/css/components.css" />
<link rel="stylesheet" href="/css/app-pages.css" />
</head>
<body>
<div class="bg-fx"><div class="bg-grid"></div></div>
<div class="public">

  <header class="pub-nav">
    <a class="brand" href="/index.html">
      <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 10 10-5 10 5-10 5z"/><path d="M6 12v5c0 1 3 2.5 6 2.5s6-1.5 6-2.5v-5"/></svg></span>
      <span class="brand-name">Kalvi<span>AI</span></span>
    </a>
    <nav class="nav-links"><a href="/login.html">← Back to login</a></nav>
  </header>

  <div class="auth-main" style="min-height:calc(100dvh - 80px)">
    <div class="auth-card">
      <div class="icon-box icon-box-lg mb-24">🔑</div>
      <h1 style="font-size:1.7rem">Reset your password</h1>
      <p class="muted small" style="margin:10px 0 24px">Enter the email you registered with and we will send you a secure link to set a new password.</p>

      <div id="modeNotice"></div>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-group">
            <svg class="ico input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
            <input class="input" id="email" name="email" type="email" placeholder="you@school.edu" autocomplete="email" required />
          </div>
          <div class="field-error" data-for="email"></div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit" id="submitBtn">Send reset link</button>
      </form>

      <div class="card mt-24" id="sentCard" style="display:none;background:var(--success-soft);border-color:rgba(52,211,153,.3)">
        <b>Check your inbox</b>
        <p class="small muted" style="margin-top:6px">If an account exists for that address, a reset link is on its way. The link expires in one hour.</p>
      </div>

      <p class="small dim center mt-24">Remembered it? <a href="/login.html" style="color:var(--primary-2);font-weight:600">Back to login</a></p>
    </div>
  </div>
</div>

<script type="module" src="/js/pages/forgot.js"></script>
</body>
</html>
